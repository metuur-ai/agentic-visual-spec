# .agents/uncle-dev-setup.yaml
# yaml-language-server: $schema=../scripts/uncle-dev-setup.schema.json
# Uncle Dev project configuration — generated by /uncle-dev-setup
#
# This file is the single source of truth for how uncle-dev behaves in this project.
# Edit it to enable/disable hooks, declare companion skills, and set preferences.
#
# After editing:
#   - Hook toggles: re-run /uncle-dev-setup to sync changes into .claude/settings.json
#   - Companion skills: reference them by path when prompting (/uncle-dev-build, /uncle-dev-review)
#   - Preferences: agents read this file at the start of each session

version: "1.4.1"

# ── Project metadata ──────────────────────────────────────────────────────────
# Inferred from directory name on first run. Edit to match your project.
project:
  name: "agentic-visual-spec"
  setup_date: "2026-08-07"
  type: "web-app" # web-app | api | mobile | library | cli | monorepo
  language: "" # typescript | javascript | python | go | rust | etc.
  framework: "" # react | nextjs | express | fastapi | etc. (blank if none)

# ── Tool configuration ────────────────────────────────────────────────────────
# Populated automatically by /uncle-dev-setup based on detected tools.
# Do not edit manually unless you know a tool was missed during detection.
tool:
  # Tools detected and configured during setup.
  # Valid values: claude-code | codex | opencode
  active: [claude-code,codex,opencode]

  # Absolute path to the cloned uncle-dev agent-skills repository.
  # Used to re-run install scripts and to locate hooks.
  # Leave blank if installed exclusively via marketplace.
  agent_skills_root: "/Users/javierbenavides/.claude/plugins/cache/uncle-dev-agent-skills/uncle-dev/1.5.0"

# ── Skill configuration ───────────────────────────────────────────────────────
# All uncle-dev skills are always available — there is no opt-in/opt-out list.
# To customize a skill, see /uncle-dev-custom-me and the uncle-dev-custom-me skill.
skills:
  # Per-skill OVERRIDES — replace an uncle-dev skill with your own SKILL.md.
  #
  # Form (loaded by the runtime in v1):
  #   <uncle-dev-skill-name>:
  #     path: <relative path to your SKILL.md from project root>
  #     name: <short name used in prompts>
  #
  # Example:
  #   uncle-dev-test-driven-development:
  #     path: .agents/skills/tdd-plus/SKILL.md
  #     name: tdd-plus
  #
  # The override replaces the base skill FULLY — your SKILL.md must include
  # every standard section (see docs/originals/skill-anatomy.md). Authored via
  # /uncle-dev-custom-me override <base> <new-name>.
  #
  # Note: free-form per-skill knobs (e.g., test_runner) are also tolerated
  # here as additional keys, but no command reads them today.
  overrides: {}

  # COMPANION skills — augment an uncle-dev skill without duplicating its content.
  #
  # Form (loaded by the runtime in v1 — per-skill, keyed by base skill name):
  #   <uncle-dev-skill-name>:
  #     - path: <relative path to your companion SKILL.md from project root>
  #       name: <short name used in prompts>
  #
  # Example:
  #   uncle-dev-test-driven-development:
  #     - path: .agents/skills/team-tdd-rules/SKILL.md
  #       name: team-tdd-rules
  #
  # A companion SKILL.md contains ONLY the delta: a ## Companion Additions
  # section (plus optional ## Additional Red Flags, ## Project-Specific
  # Patterns, ## Local Verification Steps). It MUST declare
  # `companion_to: <base-skill>` in its frontmatter. Authored via
  # /uncle-dev-custom-me companion <base> <new-name>.
  #
  # v2 — not loaded yet: a per-phase form (define / plan / build / verify /
  # review / ship / capture / maintain) is permitted by the schema but
  # ignored by the v1 runtime. Use the per-skill form above.
  companions: {}

# ── Workflow preferences ──────────────────────────────────────────────────────
preferences:
  level: "strict" # strict | lite (shared strictness level for dev/test skills)
  execution_profile: "fast" # fast | balanced | strict (workflow speed vs guardrail strictness)
  sdd_required: true # require /uncle-dev-spec (OpenSpec artifact) before coding
  sdd_mode: "lid-ears"  # lid-ears | openspec
  tdd-mode: lite # strict | lite
  spec_annotations: true # require @spec IDs linking code to specs
  graphify: true # set true after running: graphify . (creates graphify-out/)
  knowledge_capture: true # enable post-test nudge to run /uncle-dev-knowledge-capture
  destructive_guard: true # block dangerous git/db commands via hook
  mutation-testing: false # set to true to enable uncle-dev-mutation-testing skill
  wrap_trigger:
    enabled: true # enable /uncle-dev-wrap nudge when token/context thresholds are high
    context_window_percent: 70
    total_tokens: 130000
  test_resource_guard:
    orphan_threshold: 40 # advise when more than N orphaned runtime processes survive a test run

# ── Hook toggles ─────────────────────────────────────────────────────────────
# All hooks default to on. Set to false to disable a specific guard.
# After changing toggles, re-run /uncle-dev-setup to sync into .claude/settings.json.
hooks:
  session_start: true # injects Skill Discovery flowchart on every session start
  pre_commit: true # validates commit message quality and scans for debug artifacts
  spec_coherence: true # blocks edits/commits that cite undefined @spec IDs
  openspec_guard: true # validates OpenSpec change artifact structure on write
  destructive_command_guard: true # warns before destructive git/db shell commands
  knowledge_capture_nudge: true # nudges to capture learnings after test/build success
  wrap_nudge: true # nudges to run /uncle-dev-wrap near token/context limits
  test_resource_guard: true # detects test suites leaking orphaned server processes

# ── OpenSpec conventions ──────────────────────────────────────────────────────
openspec:
  change_id_format: "NNN-slug" # e.g. 001-user-auth, 042-payment-refactor
  required_artifacts:
    - proposal.md
    - design.md
    - tasks.md
    - execution.md
    - handoff.md
